name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Check Package
        run: npm run release:check
      - name: Build Docs
        run: npm run docs:build
